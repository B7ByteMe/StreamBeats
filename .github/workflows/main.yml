name: "Build & Release"

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================
  # JOB 1: WINDOWS & ANDROID
  # ============================================================
  build-windows-android:
    name: Build Windows & Android
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        shell: powershell
        run: |
          $vLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          if (-not $vLine) { Write-Error 'version not found in pubspec.yaml'; exit 1 }
          $ver = $vLine.Matches[0].Groups[1].Value.Split('+')[0]
          echo "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Setup Keystore
        shell: powershell
        run: |
          $b64 = "${{ secrets.KEY_STORE || secrets.KEYSTORE_BASE64 }}"
          if ($b64 -and $b64.Trim() -ne "") {
            Write-Host "Restoring keystore from GitHub Secret..."
            $bytes = [Convert]::FromBase64String($b64)
            [IO.File]::WriteAllBytes("./android/streambeats.jks", $bytes)
            Set-Content -Path "./android/key.properties" -Value "storePassword=${{ secrets.STORE_PASSWORD }}`nkeyPassword=${{ secrets.KEY_PASSWORD }}`nkeyAlias=${{ secrets.KEY_ALIAS }}`nstoreFile=streambeats.jks"
          } else {
            Write-Host "Generating self-contained release keystore with V1 & V2 signing..."
            & keytool -genkey -v -keystore ./android/streambeats.jks -keyalg RSA -keysize 2048 -validity 10000 -alias streambeats -storepass streambeats123 -keypass streambeats123 -dname "CN=StreamBeats, OU=Mobile, O=StreamBeats, L=Jakarta, ST=Jakarta, C=ID"
            Set-Content -Path "./android/key.properties" -Value "storePassword=streambeats123`nkeyPassword=streambeats123`nkeyAlias=streambeats`nstoreFile=streambeats.jks"
          }

      - name: Build Android APKs
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Organize APK Files
        shell: powershell
        run: |
          cd build/app/outputs/flutter-apk
          Get-ChildItem -Name
          if (Test-Path "app-arm64-v8a-release.apk") { Copy-Item "app-arm64-v8a-release.apk" "StreamBeats-arm64-v8a.apk" }
          if (Test-Path "app-armeabi-v7a-release.apk") { Copy-Item "app-armeabi-v7a-release.apk" "StreamBeats-armeabi-v7a.apk" }
          if (Test-Path "app-x86_64-release.apk") { Copy-Item "app-x86_64-release.apk" "StreamBeats-x86_64.apk" }
          if (Test-Path "app-universal-release.apk") {
            Copy-Item "app-universal-release.apk" "StreamBeats-universal.apk"
          } elseif (Test-Path "app-release.apk") {
            Copy-Item "app-release.apk" "StreamBeats-universal.apk"
          }

      - name: Verify APK Signatures (apksigner)
        shell: powershell
        run: |
          $buildToolsDir = Get-ChildItem "$env:ANDROID_HOME\build-tools" | Where-Object { $_.PSIsContainer } | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "Using Android build tools: $($buildToolsDir.Name)"
          cd build/app/outputs/flutter-apk
          Get-ChildItem StreamBeats-*.apk | ForEach-Object {
            Write-Host "Verifying $($_.Name)..."
            & "$($buildToolsDir.FullName)\apksigner.bat" verify --verbose $_.FullName
          }

      - name: Build Windows App
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows EXE Installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION windows\installer.iss

      - name: ZIP Portable Windows
        shell: powershell
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\x64\runner\StreamBeats-windows-x64.zip

      - name: Publish Windows & Android to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            build/app/outputs/flutter-apk/StreamBeats-arm64-v8a.apk
            build/app/outputs/flutter-apk/StreamBeats-universal.apk
            build/app/outputs/flutter-apk/StreamBeats-armeabi-v7a.apk
            build/app/outputs/flutter-apk/StreamBeats-x86_64.apk
            build/windows/x64/runner/StreamBeats-Setup.exe
            build/windows/x64/runner/StreamBeats-windows-x64.zip
          tag: v${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          allowUpdates: true

  # ============================================================
  # JOB 2: LINUX
  # ============================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev libpulse-dev

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Linux App
        run: flutter build linux --release

      - name: Compress Linux Build
        run: |
          tar -czf StreamBeats-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Publish Linux to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: StreamBeats-linux-x64.tar.gz
          tag: v${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          allowUpdates: true
          omitBodyDuringUpdate: true

  # ============================================================
  # JOB 3: MACOS (MacBook)
  # ============================================================
  build-macos:
    name: Build macOS
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build macOS App
        run: flutter build macos --release

      - name: Package DMG & ZIP
        run: |
          cd build/macos/Build/Products/Release
          zip -r -9 ${{ github.workspace }}/StreamBeats-macOS.zip StreamBeats.app
          hdiutil create -volname "StreamBeats" -srcfolder StreamBeats.app -ov -format UDZO ${{ github.workspace }}/StreamBeats-macOS.dmg || true

      - name: Publish macOS to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            StreamBeats-macOS.dmg
            StreamBeats-macOS.zip
          tag: v${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          allowUpdates: true
          omitBodyDuringUpdate: true

  # ============================================================
  # JOB 4: IOS (iPhone / iPad Sideload IPA)
  # ============================================================
  build-ios:
    name: Build iOS
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Sideload IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 ${{ github.workspace }}/StreamBeats-iOS.ipa Payload

      - name: Publish iOS to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: StreamBeats-iOS.ipa
          tag: v${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          allowUpdates: true
          omitBodyDuringUpdate: true