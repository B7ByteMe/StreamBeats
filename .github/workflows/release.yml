name: 🚀 Build & Release StreamBeats

# ============================================================
# TRIGGER: Jalankan otomatis saat ada tag baru (v*) atau manual (workflow_dispatch)
# ============================================================
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # JOB 1: BUILD ANDROID APKs (arm64, armv7, x86_64, universal)
  # Menjamin V1, V2 signing aktif agar tidak ada error 'paket rusak'
  # ============================================================
  build-android:
    name: 🤖 Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependensi
        run: flutter pub get

      - name: 🔑 Siapkan Keystore Resmi untuk Signing APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KEY_STORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Memulihkan keystore dari secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/streambeats.jks
            if [ -n "$KEY_PROPERTIES" ]; then
              echo "$KEY_PROPERTIES" > android/key.properties
            else
              cat <<EOF > android/key.properties
storePassword=${STORE_PASSWORD:-streambeats123}
keyPassword=${KEY_PASSWORD:-streambeats123}
keyAlias=${KEY_ALIAS:-streambeats}
storeFile=streambeats.jks
EOF
            fi
          elif [ ! -f android/key.properties ]; then
            echo "Membuat release keystore StreamBeats mandiri (V1 & V2 compatible)..."
            keytool -genkey -v -keystore android/streambeats.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias streambeats -storepass streambeats123 -keypass streambeats123 \
              -dname "CN=StreamBeats, OU=Mobile, O=StreamBeats, L=Jakarta, ST=Jakarta, C=ID"
            cat <<EOF > android/key.properties
storePassword=streambeats123
keyPassword=streambeats123
keyAlias=streambeats
storeFile=streambeats.jks
EOF
          fi

      - name: 🏗️ Build Semua Versi APK (arm64, armv7, x86_64, universal)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: 📋 Rapikan Nama APK Resmi
        run: |
          cd build/app/outputs/flutter-apk
          ls -la

          # 1. arm64-v8a (HP modern)
          if [ -f app-arm64-v8a-release.apk ]; then
            cp app-arm64-v8a-release.apk StreamBeats-arm64-v8a.apk
          fi

          # 2. armeabi-v7a (HP lama)
          if [ -f app-armeabi-v7a-release.apk ]; then
            cp app-armeabi-v7a-release.apk StreamBeats-armeabi-v7a.apk
          fi

          # 3. x86_64 (Emulator)
          if [ -f app-x86_64-release.apk ]; then
            cp app-x86_64-release.apk StreamBeats-x86_64.apk
          fi

          # 4. Universal (Semua HP)
          if [ -f app-universal-release.apk ]; then
            cp app-universal-release.apk StreamBeats-universal.apk
          elif [ -f app-release.apk ]; then
            cp app-release.apk StreamBeats-universal.apk
          fi

      - name: 🔍 Verifikasi Integritas dan Tanda Tangan APK (apksigner)
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Menggunakan build-tools: $BUILD_TOOLS_DIR"
          cd build/app/outputs/flutter-apk
          for apk in StreamBeats-*.apk; do
            if [ -f "$apk" ]; then
              echo "=== Verifikasi $apk ==="
              $BUILD_TOOLS_DIR/apksigner verify --verbose "$apk"
            fi
          done

      - name: 📤 Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/StreamBeats-*.apk

  # ============================================================
  # JOB 2: BUILD WINDOWS (Installer EXE + ZIP Portable)
  # ============================================================
  build-windows:
    name: 🪟 Build Windows
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependensi
        run: flutter pub get

      - name: 🏗️ Build Windows Release
        run: flutter build windows --release

      - name: 📦 Install Inno Setup
        run: choco install innosetup -y

      - name: 🏗️ Buat Windows EXE Installer
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern "^version:\s*(\S+)" | Select-Object -First 1).Matches[0].Groups[1].Value -replace '\+.*',''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version windows\installer.iss

      - name: 📦 Buat ZIP Portable Windows
        shell: powershell
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath StreamBeats-windows-x64.zip

      - name: 📤 Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            build\windows\x64\runner\StreamBeats-Setup.exe
            StreamBeats-windows-x64.zip

  # ============================================================
  # JOB 3: BUILD LINUX (Tarball Standalone)
  # ============================================================
  build-linux:
    name: 🐧 Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: 🔧 Install dependensi sistem Linux
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libblkid-dev liblzma-dev libasound2-dev libpulse-dev

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependensi
        run: flutter pub get

      - name: 🏗️ Build Linux Release
        run: flutter build linux --release

      - name: 📦 Tar hasil build Linux
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ${{ github.workspace }}/StreamBeats-linux-x64.tar.gz .

      - name: 📤 Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: StreamBeats-linux-x64.tar.gz

  # ============================================================
  # JOB 4: BUILD MACOS (MacBook & iMac DMG + ZIP)
  # ============================================================
  build-macos:
    name: 🍎 Build macOS (MacBook)
    runs-on: macos-14
    continue-on-error: true

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependensi
        run: flutter pub get

      - name: 🏗️ Build macOS Release
        run: flutter build macos --release

      - name: 📦 Buat Paket DMG & ZIP macOS
        run: |
          cd build/macos/Build/Products/Release
          # 1. Zip
          zip -r -9 ${{ github.workspace }}/StreamBeats-macOS.zip StreamBeats.app
          # 2. DMG
          hdiutil create -volname "StreamBeats" -srcfolder StreamBeats.app -ov -format UDZO ${{ github.workspace }}/StreamBeats-macOS.dmg || true

      - name: 📤 Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            StreamBeats-macOS.dmg
            StreamBeats-macOS.zip

  # ============================================================
  # JOB 5: BUILD IOS (iPhone / iPad Sideload IPA)
  # ============================================================
  build-ios:
    name: 📱 Build iOS (iPhone / iPad Sideload)
    runs-on: macos-14
    continue-on-error: true

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependensi
        run: flutter pub get

      - name: 🏗️ Build iOS (Unsigned untuk Sideloading)
        run: flutter build ios --release --no-codesign

      - name: 📦 Buat Paket IPA untuk AltStore / TrollStore / Scarlet
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 ${{ github.workspace }}/StreamBeats-iOS.ipa Payload
          rm -rf Payload

      - name: 📤 Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: StreamBeats-iOS.ipa

  # ============================================================
  # JOB 6: PUBLISH GITHUB RELEASE RESMI
  # Menggabungkan seluruh installer multi-platform ke GitHub Release
  # ============================================================
  create-release:
    name: 📦 Publikasikan Multi-Platform GitHub Release
    needs: [build-android, build-windows, build-linux, build-macos, build-ios]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: 📂 Buat direktori release-files
        run: mkdir -p release-files

      - name: 📥 Download artifact Android
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-files/
        continue-on-error: true

      - name: 📥 Download artifact Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-files/
        continue-on-error: true

      - name: 📥 Download artifact Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release-files/
        continue-on-error: true

      - name: 📥 Download artifact macOS
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: release-files/
        continue-on-error: true

      - name: 📥 Download artifact iOS
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: release-files/
        continue-on-error: true

      - name: 📋 Periksa semua file rilis
        run: |
          echo "Daftar file rilis yang berhasil dibuat:"
          ls -lh release-files/

      - name: 🚀 Buat atau Perbarui GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v3.2.6' }}
          name: "StreamBeats ${{ github.ref_type == 'tag' && github.ref_name || 'v3.2.6' }}"
          body: |
            ## 🎵 StreamBeats ${{ github.ref_type == 'tag' && github.ref_name || 'v3.2.6' }} Official Release

            Aplikasi pemutar musik lintas platform bebas iklan, ringan, dan cepat!

            ### 📥 Daftar File Unduhan Resmi:

            | File | Platform | Keterangan |
            |---|---|---|
            | `StreamBeats-arm64-v8a.apk` | 🤖 Android | HP modern 64-bit (**Direkomendasikan!**) |
            | `StreamBeats-universal.apk` | 🤖 Android | Semua HP (Universal - jika ragu) |
            | `StreamBeats-armeabi-v7a.apk` | 🤖 Android | HP lama 32-bit |
            | `StreamBeats-x86_64.apk` | 🤖 Android | Emulator PC & Intel |
            | `StreamBeats-Setup.exe` | 🪟 Windows | Installer Windows 10 & 11 |
            | `StreamBeats-windows-x64.zip` | 🪟 Windows | Portable Windows 64-bit |
            | `StreamBeats-linux-x64.tar.gz` | 🐧 Linux | Linux x64 Standalone |
            | `StreamBeats-macOS.dmg` | 🍎 macOS | Apple Silicon & Intel Mac |
            | `StreamBeats-macOS.zip` | 🍎 macOS | Arsip Mac Standalone |
            | `StreamBeats-iOS.ipa` | 📱 iOS | Sideload via AltStore / TrollStore |

            ---
            *Otomatis di-build dan diverifikasi menggunakan GitHub Actions.*
          draft: false
          prerelease: false
          files: release-files/*
